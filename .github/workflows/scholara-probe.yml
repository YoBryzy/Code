name: Scholara probe (temporary)

on:
  push:
    branches: ["claude/exciting-hawking-tzhrps"]
    paths: [".github/workflows/scholara-probe.yml", "scholara/ci/probe/**"]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mss pillow
      - uses: actions/cache@v4
        with:
          path: D:\models
          key: probe-models-qwen3vl-v1
      - run: python scholara/ci/probe/probe2.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_CACHE: D:\models

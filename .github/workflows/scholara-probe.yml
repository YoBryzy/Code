name: Scholara probe (temporary)

on:
  push:
    branches: ["claude/exciting-hawking-tzhrps"]
    paths: [".github/workflows/scholara-probe.yml", "scholara/ci/probe/**"]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mss
      - run: python scholara/ci/probe/probe.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GPU / vulkan
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM, DriverVersion | Format-List
          Test-Path C:\Windows\System32\vulkan-1.dll
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory | Format-List
          (Get-Item "C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
          choco --version
